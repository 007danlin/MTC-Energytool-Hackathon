openapi: 3.0.3
info:
  title: Energytool Consultation API
  version: 1.0.0
  description: Go backend API for isolated Energytool consultation sessions.
servers:
  - url: /api/v1
paths:
  /health/live:
    servers:
      - url: /
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is running
  /health/ready:
    servers:
      - url: /
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Required dependencies are ready
        '503':
          description: One or more required dependencies are unavailable
  /sessions:
    post:
      summary: Create an isolated consultation session
      operationId: createSession
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      summary: Get session metadata
      responses:
        '200':
          description: Session metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      summary: Get ordered session history
      responses:
        '200':
          description: Ordered messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
    post:
      summary: Add a user message and run consultation
      operationId: appendMessage
      description: Automatic retries are not safe; idempotency keys are not implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        '200':
          description: Consultation completed, including a typed technical error status if ML was unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is closed
        '413':
          description: Request exceeds configured size limits
  /sessions/{session_id}/lead:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      summary: Get current lead state for a session
      responses:
        '200':
          description: Current lead state; sent is always false until a delivery integration exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/application:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    post:
      summary: Save the reviewed contact and summary without sending externally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '200':
          description: Session containing the saved application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Session is closed
components:
  parameters:
    SessionID:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [summary]
      description: At least one nonempty valid phone or email is required. Every supplied nonempty contact is validated. Name and company are optional. This saves locally; no mail, call or CRM delivery is performed.
      anyOf:
        - required: [phone]
          properties:
            phone: { minLength: 1 }
        - required: [email]
          properties:
            email: { minLength: 1 }
      properties:
        full_name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40, description: "10–15 digits; optional +, spaces, parentheses and hyphens." }
        email: { type: string, maxLength: 254, description: "Single ASCII mailbox; local part ≤64, domain labels ≤63 and at least two labels; syntax only." }
        company: { type: string, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        callback_mode: { type: string, enum: ['', asap, scheduled] }
        callback_at: { type: string, description: "RFC3339 time for scheduled; empty otherwise." }
    Application:
      type: object
      required: [id, saved_at, summary, phone]
      # number is assigned by the server; id remains the stable internal identifier.
      properties:
        id: { type: string }
        number: { type: string, pattern: '^[1-9][0-9]{5}$', example: '738498', readOnly: true }
        saved_at: { type: string, format: date-time }
        full_name: { type: string }
        phone: { type: string }
        email: { type: string }
        company: { type: string }
        summary: { type: string }
        callback_mode: { type: string }
        callback_at: { type: string }
    Session:
      type: object
      required: [id, status, created_at, updated_at]
      properties:
        application:
          $ref: '#/components/schemas/Application'
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, role, content, sequence, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sequence:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        response:
          $ref: '#/components/schemas/ResponseMetadata'
    ResponseMetadata:
      type: object
      description: Per-assistant-answer metadata, retained in session history after later turns and restarts.
      required: [status, sources, elapsed_ms]
      properties:
        status:
          $ref: '#/components/schemas/ConsultationResult/properties/status'
        sources:
          $ref: '#/components/schemas/ConsultationResult/properties/sources'
        elapsed_ms:
          type: integer
          minimum: 0
          description: Backend time waiting for the consultation service, including failed calls; excludes browser network time.
        debug:
          type: object
          additionalProperties: true
          description: Optional retrieval, validation and timing metadata. Absent on older saved messages.
    ConsultationResult:
      type: object
      required: [answer, status, sources, elapsed_ms, lead, lead_ready, summary, schema_version]
      properties:
        answer:
          type: string
        status:
          type: string
          enum: [answered, clarification, knowledge_gap, out_of_scope, technical_error]
        sources:
          type: array
          items:
            type: object
            required: [document_id, chunk_id, source_id, quote]
            properties:
              document_id: { type: string }
              chunk_id: { type: string }
              source_id: { type: string }
              quote: { type: string }
        elapsed_ms:
          type: integer
          minimum: 0
          description: Backend time waiting for the consultation service. The original ML elapsed time is retained in debug.ml_elapsed_ms when available.
        debug:
          type: object
          additionalProperties: true
        lead:
          $ref: '#/components/schemas/Lead'
        lead_ready:
          type: boolean
        summary:
          type: object
          additionalProperties: true
        schema_version:
          type: string
    Lead:
      type: object
      required: [session_id, fields, evidence, requested, declined]
      properties:
        session_id:
          type: string
          format: uuid
        fields:
          type: object
          properties:
            full_name: { type: string }
            phone: { type: string }
            email: { type: string, maxLength: 254, description: "Optional ASCII mailbox; phone or email is sufficient." }
            company: { type: string }
          additionalProperties: false
        evidence:
          type: object
          additionalProperties: true
        requested:
          type: boolean
        declined:
          type: boolean
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
