</head>
<body class="et-app c06 m " data-screen="c06-m1-start" style="width:390px;height:844px">
<header class="et-header "><a class="et-brand"><strong>МТС</strong><span>EnergyTool<span class="et-brand-divider"> / </span><span class="et-brand-subtitle">ИИ-консультант</span></span></a><button class="btn" >Меню</button></header>
<main class="et-workspace"><div class="et-scroll">
<section class="et-welcome"><h1>Что хотите решить с&nbsp;электроэнергией?</h1><p class="et-intro">Выберите задачу или опишите свою.</p></section>
<div class="tcards">
<button class="tcard on"><span class="till"><svg viewBox="0 0 120 80" width="120" height="80" fill="none" stroke="#17181c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M28 10h38v58l-6.300-4.500-6.400 4.500-6.300-4.500-6.300 4.500-6.400-4.500L28 68V10z" fill="#fff"/><path d="M37 23h20M37 31h20M37 39h11"/><path d="M37 52h20" stroke="#d9002b" stroke-width="2.200"/><path d="M76 60l11-11 6.500 6.500L107 40" stroke="#d9002b"/><path d="M99 40h8v8" stroke="#d9002b"/></svg></span><b>Снизить расходы</b><p>Счета растут или кажутся завышенными</p><span class="tgo"><svg class="ic " width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>Вопрос подставлен</span></button>
<button class="tcard "><span class="till"><svg viewBox="0 0 120 80" width="120" height="80" fill="none" stroke="#17181c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="33" y="9" width="54" height="56" rx="9" fill="#fff"/><rect x="42" y="19" width="36" height="14" rx="3"/><path d="M51 19v14M60 19v14"/><rect x="69" y="19" width="9" height="14" rx="1" fill="#d9002b" stroke="#d9002b"/><circle cx="60" cy="48" r="8"/><path d="M60 48l4.500-4.500"/><path d="M60 48v.01" stroke-width="2.400"/><path d="M47 65v8M73 65v8"/></svg></span><b>Наладить учёт</b><p>Непонятно, где и сколько расходуется</p><span class="tgo">Подставить вопрос<svg class="ic " width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M5 11l5 5 5-5"/></svg></span></button>
<button class="tcard "><span class="till"><svg viewBox="0 0 120 80" width="120" height="80" fill="none" stroke="#17181c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="34" r="6" fill="#fff"/><circle cx="104" cy="34" r="6" fill="#fff"/><path d="M22 34h28M70 34h28"/><circle cx="60" cy="34" r="17" fill="#fff"/><path d="M72.500 46.500L84 58" stroke-width="2.200"/><path d="M47 34h7M66 34h7"/><path d="M57 39l-2.500 9M60 40v10M63 39l2.500 9" stroke="#d9002b" stroke-dasharray="1.500 4"/></svg></span><b>Найти потери</b><p>Платите больше, чем потребляете по факту</p><span class="tgo">Подставить вопрос<svg class="ic " width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M5 11l5 5 5-5"/></svg></span></button></div>
</div>
<div class="m-dock"><form class="m-composer "><div class="ta ">У нас выросли счета за электроэнергию. С чего начать?</div><button class="m-send " aria-label="Отправить"><svg class="ic " width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15.500V4.500M5.500 9l4.500-4.500L14.500 9"/></svg></button></form><p class="m-note">Вопрос из карточки можно изменить перед отправкой</p></div></main>
